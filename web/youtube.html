<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Studio Visual - FourLevel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff0033'><path d='M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z'/></svg>">
  <link rel="stylesheet" href="/web/youtube_ui.css">
</head>
<body class="yt-app">

  <!-- ======================================================================
       1. TOPBAR (Altura 56px fija)
       ====================================================================== -->
  <header class="yt-topbar">
    <div class="yt-topbar-start">
      <button class="yt-icon-button" id="yt-menu-toggle" aria-label="Alternar menú lateral" title="Guía">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
      <a href="/youtube" class="yt-brand" title="Página principal">
        <svg width="28" height="20" viewBox="0 0 24 24" fill="#ff0033">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <span>StudioTube</span>
        <span class="yt-brand-badge">PRO</span>
      </a>
    </div>

    <!-- Buscador Centrado (SearchBar) -->
    <div class="yt-search-container">
      <form class="yt-search-form" id="yt-search-form" role="search">
        <div class="yt-search-input-wrapper">
          <input type="text" id="yt-search-input" class="yt-search-input" placeholder="Buscar vídeos, temas o canales..." autocomplete="off">
        </div>
        <button type="submit" class="yt-search-btn" aria-label="Buscar" title="Buscar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="m20.87 20.17-5.59-5.59A7.94 7.94 0 0 0 17 9.5a8 8 0 1 0-8 8 7.94 7.94 0 0 0 5.08-1.72l5.59 5.59.2-.2.2-.2zm-11.37-4.17a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13z"/>
          </svg>
        </button>
      </form>
    </div>

    <!-- Acciones de Usuario -->
    <div class="yt-topbar-end">
      <a href="/" class="yt-icon-button" title="Abrir Panel Studio 4" style="text-decoration:none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
        </svg>
      </a>
      <button class="yt-icon-button" title="Notificaciones">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20h4c0 1.1-.9 2-2 2s-2-.9-2-2zm10-2v-5c0-3.07-1.63-5.64-4.5-6.32V6c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C9.63 7.36 8 9.92 8 13v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
      </button>
      <button class="yt-channel-avatar-btn" title="FourLevel Oficial">
        <div class="yt-channel-avatar" style="background:#7c3aed;">FL</div>
      </button>
    </div>
  </header>

  <!-- ======================================================================
       DISTRIBUCIÓN PRINCIPAL (Sidebar + Main Content)
       ====================================================================== -->
  <div class="yt-layout">
    
    <!-- 2. SIDEBAR (Ancho ~240px) -->
    <aside class="yt-sidebar" id="yt-sidebar">
      <div class="yt-sidebar-section">
        <a href="#inicio" class="yt-nav-item active">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Principal</span>
        </a>
        <a href="#shorts" class="yt-nav-item">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.77 10.32l-1.2-.5L18 9.06a3.74 3.74 0 0 0-3.5-5.46 3.7 3.7 0 0 0-2.4 1l-6.1 6.1a3.75 3.75 0 0 0 2.5 6.4c.4 0 .8 0 1.1-.2l1.2.5-1.4.74a3.74 3.74 0 0 0 3.5 5.46 3.7 3.7 0 0 0 2.4-1l6.1-6.1a3.75 3.75 0 0 0-2.5-6.4c-.4 0-.8 0-1.1.2zM10 14.5v-5l4.5 2.5-4.5 2.5z"/></svg>
          <span>Shorts</span>
        </a>
        <a href="#suscripciones" class="yt-nav-item">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.7 8.7H5.3V7h13.4v1.7zm-1.7-5H7v1.7h10V3.7zm3.4 8.6v8.4c0 .9-.8 1.7-1.7 1.7H5.3c-.9 0-1.7-.8-1.7-1.7v-8.4c0-.9.8-1.7 1.7-1.7h13.4c.9 0 1.7.8 1.7 1.7zm-1.7 0H5.3v8.4h13.4v-8.4zm-8 1.7l5.3 2.5-5.3 2.5v-5z"/></svg>
          <span>Suscripciones</span>
        </a>
      </div>

      <div class="yt-sidebar-section">
        <span class="yt-sidebar-title">Tu canal y Producción</span>
        <a href="/" class="yt-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/></svg>
          <span>Panel Studio 4</span>
        </a>
        <a href="/#flow" class="yt-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
          <span>Flow Clips</span>
        </a>
        <a href="/#tendencias" class="yt-nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
          <span>Tendencias y Nichos</span>
        </a>
      </div>

      <div class="yt-sidebar-section">
        <span class="yt-sidebar-title">Canales Activos</span>
        <a href="#fourlevel" class="yt-nav-item">
          <div class="yt-channel-avatar" style="width:24px;height:24px;font-size:10px;background:#7c3aed;">FL</div>
          <span>FourLevel</span>
        </a>
        <a href="#arigab" class="yt-nav-item">
          <div class="yt-channel-avatar" style="width:24px;height:24px;font-size:10px;background:#0d9488;">AR</div>
          <span>ARIGAB</span>
        </a>
      </div>
    </aside>

    <!-- 3. ÁREA PRINCIPAL -->
    <main class="yt-main-content">
      
      <!-- Filtros por Categorías (CategoryFilters) -->
      <nav class="yt-category-filters" id="yt-category-filters" aria-label="Categorías"></nav>

      <!-- Pantalla de ver un vídeo: tu montaje con su título, canal y descripción, como en YouTube -->
      <section class="yt-ver" id="yt-ver" hidden></section>

      <!-- Galería de Contenido (VideoGrid) -->
      <section class="yt-video-grid" id="yt-video-grid"></section>
    </main>

  </div>

  <script type="module">
    import { initYouTubeUI } from '/web/youtube_ui.js';
    document.addEventListener("DOMContentLoaded", initYouTubeUI);
  </script>
</body>
</html>
