<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sofi · Studio 4</title>
<link rel="icon" href="/web/logo.png">
<style>
  :root { --fondo: #05060a; --texto: #e9eef7; --tenue: #7d8798; --cian: #3fe0ff; --rosa: #ff3ea5; --oro: #c8a45a; --violeta: #9a7bff;
    --caja: rgba(14, 18, 28, .72); --borde: rgba(63, 224, 255, .18); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #lienzo { position: fixed; inset: 0; }
  .capa { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 24px; }
  .arriba { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .tarjetas { display: flex; gap: 12px; flex-wrap: wrap; }
  .tarjeta { pointer-events: auto; padding: 14px 18px; border-radius: 14px; background: var(--caja); border: 1px solid var(--borde);
    backdrop-filter: blur(8px); min-width: 170px; }
  .tarjeta small { display: block; color: var(--tenue); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .tarjeta b { font-size: 26px; letter-spacing: .02em; }
  .estado { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--cian); display: flex; align-items: center; gap: 8px; }
  .estado i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
  .centro { display: grid; place-items: end center; padding-bottom: 8vh; }
  .dicho { max-width: 860px; text-align: center; font-size: 20px; line-height: 1.45; min-height: 3em; text-shadow: 0 2px 14px #000; }
  .dicho .tu { color: var(--tenue); font-size: 15px; display: block; margin-bottom: 6px; }
  .abajo { display: grid; gap: 10px; justify-items: center; }
  form { pointer-events: auto; display: flex; gap: 8px; width: min(760px, 100%); padding: 8px; border-radius: 16px;
    background: var(--caja); border: 1px solid var(--borde); backdrop-filter: blur(8px); }
  input { flex: 1; background: transparent; border: 0; color: var(--texto); font-size: 16px; padding: 10px 12px; outline: none; }
  button { pointer-events: auto; border: 1px solid var(--borde); background: rgba(63, 224, 255, .08); color: var(--texto); border-radius: 12px;
    padding: 10px 16px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  button.activo { border-color: var(--rosa); color: var(--rosa); }
  .ayuda { color: var(--tenue); font-size: 12px; letter-spacing: .06em; }
  a.volver { pointer-events: auto; color: var(--tenue); font-size: 12px; text-decoration: none; letter-spacing: .1em; }
  @media (max-width: 640px) { .tarjeta b { font-size: 20px; } .dicho { font-size: 17px; } }
</style>
<script type="importmap">{ "imports": { "three": "/web/vendor/three/three.module.js" } }</script>
</head>
<body>
<canvas id="lienzo"></canvas>
<div class="capa">
  <div class="arriba">
    <div class="tarjetas" id="tarjetas"></div>
    <div style="display:grid;gap:10px;justify-items:end">
      <div class="estado" id="estado"><i></i><span>En espera · di «Oye Sofi»</span></div>
      <a class="volver" href="/">← Volver a Studio 4</a>
    </div>
  </div>
  <div class="centro"><div class="dicho" id="dicho"></div></div>
  <div class="abajo">
    <form id="form"><input id="texto" placeholder="Escríbele a Sofi… («¿cómo va el vídeo?», «busca un nicho de misterios»)" autocomplete="off">
      <button type="button" id="mic">Micro: apagado</button><button type="submit">Enviar</button></form>
    <span class="ayuda">Di «Oye Sofi» y tu pedido · Espacio: hablar sin palabra clave · Esc: callar</span>
  </div>
</div>
<script type="module" src="/web/sofi.js"></script>
</body>
</html>
