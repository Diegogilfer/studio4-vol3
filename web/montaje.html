<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio 4</title>
<link rel="icon" href="/web/studio4.ico">
<link rel="stylesheet" href="/web/montaje.css">
<script>try { document.documentElement.dataset.tema = localStorage.getItem("s4-tema") || "cristal"; } catch (e) { document.documentElement.dataset.tema = "cristal"; }</script>
</head>
<body>

    <symbol id="i-escenas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M7 4v16M17 4v16M2 9h5M17 9h5M2 15h5M17 15h5"/></symbol>
    <symbol id="i-guion" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="i-tendencias" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
    <symbol id="i-canales" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="i-enlace" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="i-crear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-render" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></symbol>
    <symbol id="i-entregas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>

    <symbol id="i-voz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>

<!-- Pantalla de carga: se va cuando el panel ya tiene sus datos -->
<div id="carga" class="carga"><div class="carga-logo">S4</div><p>Cargando tu estudio…</p></div>

<header class="barra">
  <a class="marca" href="#inicio"><span class="marca-logo">S4</span><span>Studio 4</span></a>
  <nav class="nav" id="nav">
    <a href="#inicio" data-vista="inicio"><svg><use href="#i-inicio"/></svg><span>Inicio</span></a>
    <a href="#videos" data-vista="videos"><svg><use href="#i-escenas"/></svg><span>Vídeos</span></a>
    <a href="#biblioteca" data-vista="biblioteca"><svg><use href="#i-guion"/></svg><span>Biblioteca</span></a>
    <a href="#tendencias" data-vista="tendencias"><svg><use href="#i-tendencias"/></svg><span>Tendencias</span></a>
    <a href="#musica" data-vista="musica"><svg><use href="#i-musica"/></svg><span>Música</span></a>
    <a href="#canal" data-vista="canal"><svg><use href="#i-canales"/></svg><span>Canal</span></a>
    <a href="#herramientas" data-vista="herramientas"><svg><use href="#i-herramientas"/></svg><span>Herramientas</span></a>
    <a href="#planes" data-vista="planes"><svg><use href="#i-entregas"/></svg><span>Planes</span></a>
  </nav>
  <span class="canal" id="canal"></span>
  <button class="tema-boton" type="button" id="tema-boton" aria-label="Cambiar el tema" title="Tema del panel"><i></i></button>
  <div class="temas" id="temas" hidden><span class="etiqueta">Tema del panel</span><div class="temas-rejilla" id="temas-rejilla"></div></div>
</header>

<main id="vista"></main>

<!-- Elegir plano: los planos de las fuentes del vídeo -->
<div class="velo" id="selector" hidden>
  <div class="selector">
    <div class="selector-cab">
      <div><small id="sel-frase-n"></small><p id="sel-frase"></p></div>
      <button class="redondo" type="button" data-cerrar aria-label="Cerrar">✕</button>
    </div>
    <div class="pestanas" id="sel-fuentes"></div>
    <div class="planos" id="sel-planos"></div>
  </div>
</div>

<!-- El trabajo en marcha (descargas, previa, final): siempre a la vista -->
<div class="trabajo" id="trabajo" hidden>
  <div class="trabajo-txt"><b id="trabajo-fase"></b><span id="trabajo-pct"></span></div>
  <div class="trabajo-barra"><i id="trabajo-barra"></i></div>
</div>
<div class="aviso" id="aviso" role="alert" hidden></div>

<script src="/web/montaje.js"></script>
<script type="importmap">{ "imports": { "three": "/web/vendor/three/three.module.js" } }</script>
<script type="module" src="/web/fondo3d.js"></script>
</body>
</html>
